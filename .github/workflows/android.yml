name: Android APK Build (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'crates/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk || true

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev pkg-config cmake ninja-build

      - name: Build Android ARM64 Libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a build --package horizon-client-input --release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64
          path: |
            target/aarch64-linux-android/release/*.so
            target/aarch64-linux-android/release/*.a
          if-no-files-found: warn

name: Android APK Build (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'packaging/android/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Horizon Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4

      - name: Setup local debug keystore
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          path = Path('.local/android/debug.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          val = os.environ.get('DEV_KEYSTORE', '')
          if val:
              path.write_bytes(base64.b64decode(val, validate=True))
              path.chmod(0o600)
              print('Restored DEV_KEYSTORE from secret.')
          else:
              subprocess.run(['keytool', '-genkeypair', '-keystore', str(path), '-storepass', 'android',
                              '-keypass', 'android', '-alias', 'androiddebugkey', '-keyalg', 'RSA',
                              '-validity', '3650', '-dname', 'CN=Horizon Android,O=Horizon,C=US'], check=True)
              print('Generated fresh debug keystore.')
          PY

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android toolchain (SDK, NDK, target)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android

      - name: Check public tree
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'

      - name: Prepare private engine inputs from Mojang downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"

      - name: Build optimized public APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk dist/horizon-android-arm64.apk
          ls -lh dist/horizon-android-arm64.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64.apk
          path: dist/horizon-android-arm64.apk

      - name: Publish to GitHub Releases (v0.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### 🎮 Horizon Android (ARM64) — Full Engine + Touch Controls + Shaders

          Minecraft Java Edition 26.3 Rust client ported to Android by **RedGlitchX** (based on Horizon & Starling).

          #### 📱 Features:
          - **Full Engine & Assets Bundled:** Prepared assets & textures downloaded directly from Mojang.
          - **Pojav & Bedrock Touch Controls:** Complete on-screen controls, HUD editor, virtual mouse, D-Pad, Jump, Sneak, Sprint, and Offhand Swap (`SWAP` / `F`).
          - **Hotbar Long-Press Drop:** Hold any hotbar slot to drop items. Hold Shift on screen to drop the entire stack at once!
          - **Quick Craft All:** Shift-tap the crafting output slot to craft all available items instantly!
          - **Native Modding (`.hnmod` & `.hmod`):** Full support for Horizon native mods and Wasm mods.
          - **Shader Pack Support:** Built-in shader pack support (`.hshader` and `.zip`) via Naga/WGSL!
          - **GPU & Battery Optimizations:** Vulkan and GLES pipelines tuned for Qualcomm Adreno & ARM Mali GPUs with dynamic render scale.
          - **Native Storage Access (SAF):** Android DocumentsProvider integrated — no more OS permission errors!
          EOF

          gh release delete v0.1 -y || true
          git tag -d v0.1 2>/dev/null || true
          git push origin :refs/tags/v0.1 2>/dev/null || true
          gh release create v0.1 dist/horizon-android-arm64.apk \
            --title "Horizon Android (ARM64) with Pojav/Bedrock Controls & Shaders" \
            --notes-file release_notes.md

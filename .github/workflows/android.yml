name: Android APK Build (ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'crates/**'
      - 'launcher/**'
      - 'packaging/android/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'research-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Horizon Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
    steps:
      - uses: actions/checkout@v4

      - name: Setup local debug keystore
        env:
          DEV_KEYSTORE: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          from pathlib import Path
          path = Path('.local/android/debug.keystore')
          path.parent.mkdir(parents=True, exist_ok=True)
          val = os.environ.get('DEV_KEYSTORE', '')
          if val:
              path.write_bytes(base64.b64decode(val, validate=True))
              path.chmod(0o600)
              print('Restored DEV_KEYSTORE from secret.')
          else:
              subprocess.run(['keytool', '-genkeypair', '-keystore', str(path), '-storepass', 'android',
                              '-keypass', 'android', '-alias', 'androiddebugkey', '-keyalg', 'RSA',
                              '-validity', '3650', '-dname', 'CN=Horizon Android,O=Horizon,C=US'], check=True)
              print('Generated fresh debug keystore.')
          PY

      - name: Set up Java 25 (Temurin) for Mojang assets
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Java 17 (Temurin) for Gradle and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android toolchain (SDK, NDK, target)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup target add aarch64-linux-android

      - name: Check public tree
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'

      - name: Prepare private engine inputs from Mojang downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME_25_X64"

      - name: Build optimized public APK
        run: |
          python3 tools/android_build.py --abi arm64-v8a --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0 \
            --dev-build "${GITHUB_RUN_NUMBER}.${GITHUB_SHA:0:12}" \
            --dev-version-code "$((1000 + GITHUB_RUN_NUMBER))"

      - name: Collect APK
        run: |
          mkdir -p dist
          cp .local/android/apk/arm64-v8a/horizon-android-public.apk dist/horizon-arm64.apk
          ls -lh dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-arm64.apk
          path: dist/horizon-arm64.apk

      - name: Publish to GitHub Releases (v0.1)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### [>] Horizon Android (ARM64)

          Minecraft Java Edition 26.3 ultra-fast native Rust client for Android.
          High-performance mobile rendering, custom touch engine, instant PvP hitmarkers.

          #### 🤝 Upstream Collaboration Notice:
          - **PC Edition:** Created and maintained upstream by [Ludovic Marie (horizon-rust)](https://github.com/horizon-rust/horizon).
          - **Android Edition:** Actively ported, optimized, and maintained for ARM64 mobile devices by **RedGlitchX** ([@tubers9999](https://github.com/tubers9999)).
          - *„The upstream team focuses on PC development, while I take care of the Android version. Whenever PC receives updates, we sync and port them to keep the mobile experience seamless and up to date.”*

          #### Features:
          - [+] Universal Mod & Datapack Support: Search, install, and run Minecraft Java .hmod mods and datapacks directly from Modrinth with automated world injection.
          - [+] Out-of-the-Box Mod Activation: Bundled mods (Minimap, Zoom, Recipes, SmartF3) active out-of-the-box, plus full discovery and loading of .hmod sandboxed mods.
          - [+] Visual PvP Hitmarker & "Ack" Sound: Razor-sharp crimson crosshair hitmarker visual feedback paired with instant punchy audio when striking hostile mobs or players in PvP.
          - [+] Live Keystrokes & CPS Overlay: WASD + Space key visualizer with 1-second sliding-window CPS counters for Left and Right clicks.
          - [+] 1-Tap Ultra FPS Booster: Instantly toggle entity culling, cave culling, animated textures, and LOD optimizations for smooth 60-120+ FPS.
          - [+] Built-in Horizon Cyber Synthwave BGM: Looping high-octane 135 BPM soundtrack playing directly out of the box with quick Mute/Play controls.
          - [+] Signature Horizon Theme: Deep crimson gradient with liquid glass sheen and glowing corner accents.
          - [+] Custom Media Pickers: Import wallpapers, videos, or audio straight from phone storage.
          - [+] Horizon Control Hub & Touch System: Pojav & Bedrock touch controls, full HUD editor, virtual mouse, customizable button shapes.
          - [+] Live Performance Stats Overlay: Real-time FPS, frame timings (ms), CPU/GPU usage graph right on screen.
          - [+] Shader Pack Support: Naga/WGSL shader engine tuned for Mali & Adreno mobile GPUs.
          - [+] Native Storage Access (SAF): Android DocumentsProvider integrated seamlessly.
          EOF

          gh release delete v0.1 -y || true
          git tag -d v0.1 2>/dev/null || true
          git push origin :refs/tags/v0.1 2>/dev/null || true
          gh release create v0.1 dist/horizon-arm64.apk \
            --title "Horizon Android (ARM64)" \
            --notes-file release_notes.md
